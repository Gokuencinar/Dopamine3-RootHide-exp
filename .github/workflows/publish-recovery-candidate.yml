name: Publish verified RootHide candidate
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-roothide3-test-21
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Gokuencinar/Dopamine3-RootHide-exp
    steps:
      - name: Download the previously inspected build
        run: |
          gh api repos/$GH_REPO/actions/artifacts/12227521783/zip > candidate.zip
          echo 'ef381fbb859edb31d61d2efc8b2cc157aa996b87efb0b0f791db980d90454914  candidate.zip' | sha256sum -c -
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          name = 'RootHide3-Hardware-Beta-d7d653b.ipa'
          with zipfile.ZipFile('candidate.zip') as z:
              payload = z.read('Application/RootHide3-Hardware-Beta.ipa')
          expected = 'b4f39aca2e2ab2c28994ded1e13a39b0b817b2ff128b794a829ee3ef2e1b12f3'
          assert hashlib.sha256(payload).hexdigest() == expected
          pathlib.Path(name).write_bytes(payload)
          pathlib.Path(name+'.sha256').write_text(expected+'  '+name+'\n')
          PY
      - name: Verify the existing prerelease draft
        run: |
          gh api repos/$GH_REPO/releases/417832701 > release.json
          python3 - <<'PY'
          import json, pathlib
          r = json.loads(pathlib.Path('release.json').read_text())
          assert r['tag_name'] == 'roothide3-test-21' and r['prerelease'] and r['draft']
          assert r['target_commitish'] == 'd7d653b5a2722067c1837eed637641b4b03bd4cc'
          assert not r['assets'], 'Draft already has assets; inspect them before resuming'
          pathlib.Path('LEEME-d7d653b-candidata.txt').write_text('RootHide 3 — Corrección del cierre d7d653b\n\n'+r['body'], encoding='utf-8')
          PY
      - name: Upload and publish the inspected IPA
        run: |
          gh release upload roothide3-test-21 RootHide3-Hardware-Beta-d7d653b.ipa RootHide3-Hardware-Beta-d7d653b.ipa.sha256 LEEME-d7d653b-candidata.txt
          echo '{"draft":false,"prerelease":true,"make_latest":"false"}' > publish.json
          gh api --method PATCH repos/$GH_REPO/releases/417832701 --input publish.json > published.json
