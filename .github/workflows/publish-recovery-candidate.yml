name: Publish verified RootHide candidate
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-roothide3-test-18
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Gokuencinar/Dopamine3-RootHide-exp
    steps:
      - name: Download the previously inspected build
        run: |
          gh api repos/$GH_REPO/actions/artifacts/12207902771/zip > candidate.zip
          echo '831e635b3865aae39d1d49e890af6ba3118f7fc3c82edf4bf85ca897f0cad74c  candidate.zip' | sha256sum -c -
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          name = 'RootHide3-Hardware-Beta-8931dbd.ipa'
          with zipfile.ZipFile('candidate.zip') as z:
              payload = z.read('Application/RootHide3-Hardware-Beta.ipa')
          expected = '375889831e96668b09790b92e47b6af3f4be1db0dd8c413439e19c2d2f937696'
          assert hashlib.sha256(payload).hexdigest() == expected
          pathlib.Path(name).write_bytes(payload)
          pathlib.Path(name+'.sha256').write_text(expected+'  '+name+'\n')
          PY
      - name: Verify the existing prerelease draft
        run: |
          gh api repos/$GH_REPO/releases/417575534 > release.json
          python3 - <<'PY'
          import json, pathlib
          r = json.loads(pathlib.Path('release.json').read_text())
          assert r['tag_name'] == 'roothide3-test-18' and r['prerelease'] and r['draft']
          assert r['target_commitish'] == '8931dbd2c0f8bfc2199375c16778079a4ca6bf8a'
          assert not r['assets'], 'Draft already has assets; inspect them before resuming'
          pathlib.Path('LEEME-8931dbd-candidata.txt').write_text('RootHide 3 — Acciones tras el reinicio 8931dbd\n\n'+r['body'], encoding='utf-8')
          PY
      - name: Upload and publish the inspected IPA
        run: |
          gh release upload roothide3-test-18 RootHide3-Hardware-Beta-8931dbd.ipa RootHide3-Hardware-Beta-8931dbd.ipa.sha256 LEEME-8931dbd-candidata.txt
          echo '{"draft":false,"prerelease":true,"make_latest":"false"}' > publish.json
          gh api --method PATCH repos/$GH_REPO/releases/417575534 --input publish.json > published.json
