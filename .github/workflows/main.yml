name: "Dopamine: build and upload"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:
    inputs:
      hardware_beta:
        description: 'Build the unvalidated RootHide jailbreak-enabled hardware beta'
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A completely standalone UIKit-only application. Build it independently so
  # unfinished jailbreak libraries and RootHide port failures cannot prevent
  # generation of the harmless install/open smoke-test IPA.
  device-test:
    if: startsWith(github.head_ref || github.ref_name, 'roothide-')
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install signing utility
        uses: dhinakg/procursus-action@4526d5e64410da26bea8073926c0bf8e779293f1
        with:
          packages: ldid

      - name: Test standalone diagnostic safeguards
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_roothide_device_test.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_roothide_device_test_verifier.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_roothide_build_matrix.py' -v

      - name: Build standalone RootHide device-test app
        run: |
          set -euo pipefail
          make -C Application diagnostic

      - name: Inspect standalone RootHide device-test IPA
        run: |
          set -euo pipefail
          python3 tools/verify_roothide_device_test.py --ipa Application/RootHide3-Device-Test.ipa --json | tee roothide-device-test-inspection.json
          printf 'ROOT HIDE 3 — STANDALONE UI INSTALL/OPEN TEST ONLY\nKernel/jailbreak code: NOT LINKED\nNo bootstrap files or package installers.\nAd-hoc signed: requires compatible installer or legitimate re-signing for the device.\n' > ROOT_HIDE_DEVICE_TEST_README.txt

      - name: Upload standalone device-test IPA
        uses: actions/upload-artifact@v4
        with:
          name: RootHide3-Device-Test-APP-ONLY
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/Application/RootHide3-Device-Test.ipa
            ${{ github.workspace }}/roothide-device-test-inspection.json
            ${{ github.workspace }}/ROOT_HIDE_DEVICE_TEST_README.txt

  build:
    runs-on: macos-15
    env:
      # Only an explicit manual dispatch can enable the hardware variant.
      ROOTHIDE_HARDWARE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.hardware_beta == true && 'YES' || 'NO' }}
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # peeled commit for v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
            submodules: recursive

      # github.ref_name is "<number>/merge" in pull_request runs. Detect the
      # actual checked-out port as well as its branch, so a RootHide PR can
      # never silently publish an ordinary artifact named "Dopamine".
      - name: Classify experimental RootHide sources
        id: roothide_port
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" == roothide-* ]] ||
             [[ -f BaseBin/libjailbreak/src/roothider.h ]]; then
            echo 'is_port=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_port=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Procursus
        uses: dhinakg/procursus-action@4526d5e64410da26bea8073926c0bf8e779293f1
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        env:
          RH3_PORT: ${{ steps.roothide_port.outputs.is_port }}
        run: |
          set -euo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          # Use an explicitly pinned Theos revision, not an installer that
          # updates a mutable HEAD. Preserve its recursive vendor submodules.
          # The RootHide tweak targets use a different Theos package scheme.
          # Keep official Theos for the upstream Dopamine branches.
          THEOS_REPO=theos/theos
          THEOS_REV=304e0799973e8145f32e4ca2de6c747a84b758ce
          if [[ "$RH3_PORT" == true ]]; then
            THEOS_REPO=roothide/theos
            THEOS_REV=cfba89a53a05b4a1b822121158acc3669c20602f
          fi
          git clone --recursive "https://github.com/${THEOS_REPO}.git" "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_REV"
          git -C "$THEOS" submodule update --init --recursive
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_REV"
          mkdir -p "$THEOS/sdks"
          curl -fL --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            --output "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          echo "5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" | shasum -a 256 -c -
          # Decode the verified XZ archive (not gzip).
          tar -xJf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          test -n "$(find "$THEOS/sdks" -type d -name '*.sdk' -print -quit)"
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -euo pipefail
          brew install openssl@3
          git clone https://github.com/CRKatri/trustcache
          git -C trustcache checkout --detach aa0e8847529cf76576fce8d2dbc9e088c8f1a0df
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl@3)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl@3)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Download Bootstraps
        run: |
            set -euo pipefail
            cd Application/Dopamine/Resources
            bash ./download_bootstraps.sh

      - name: Verify RootHide Boomerang and trustcache regressions
        if: steps.roothide_port.outputs.is_port == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_roothide_boomerang_trustcache.py' -v

      - name: Verify full experimental app safeguards
        if: steps.roothide_port.outputs.is_port == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_roothide_full_experimental.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_roothide_build_matrix.py' -v

      - name: Test complete RootHide port regressions
        if: steps.roothide_port.outputs.is_port == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Build
        # The readiness script must use the same RootHide classification as
        # Theos selection, including PR refs such as 123/merge.
        env:
          ROOTHIDE_EXPERIMENTAL_BUILD: ${{ steps.roothide_port.outputs.is_port == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          bash tools/macos_build_readiness.sh
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1

      - name: Check RootHide binary architecture slices
        if: steps.roothide_port.outputs.is_port == 'true'
        run: |
          set -euo pipefail
          for binary in libjailbreak.dylib launchdhook.dylib systemhook.dylib roothidehooks.dylib rootlesshooks.dylib; do
            file="BaseBin/.build/$binary"
            test -f "$file"
            architectures="$(xcrun lipo -archs "$file")"
            echo "$binary: $architectures"
            [[ " $architectures " == *" arm64 "* ]] || { echo "$binary lacks arm64" >&2; exit 1; }
            [[ " $architectures " == *" arm64e "* ]] || { echo "$binary lacks arm64e" >&2; exit 1; }
          done

      # A completed Xcode/ldid build is NOT proof of RootHide functionality.
      # Save it in a plainly quarantined diagnostic artifact so developers can
      # inspect linker output without distributing it as a jailbreak release.
      - name: Inspect quarantined RootHide build
        if: steps.roothide_port.outputs.is_port == 'true'
        run: |
          set -euo pipefail
          python3 tools/verify_roothide_build.py --ipa Application/Dopamine.ipa --json | tee roothide-build-inspection.json
          printf 'ROOT HIDE 3: COMPILE-ONLY, NOT INSTALLABLE AS ROOTHIDE\nCommit: %s\nActivation: DISABLED\nRuntime/device verification: NONE\n' "$GITHUB_SHA" > ROOT_HIDE_DO_NOT_INSTALL.txt

      - name: Upload quarantined RootHide compile artifact
        if: steps.roothide_port.outputs.is_port == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RootHide3-COMPILE-ONLY-NOT-FOR-INSTALL
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ github.workspace }}/Application/Dopamine.ipa
            ${{ github.workspace }}/BaseBin/basebin.tar
            ${{ github.workspace }}/roothide-build-inspection.json
            ${{ github.workspace }}/ROOT_HIDE_DO_NOT_INSTALL.txt

      # A second artifact with ALL Dopamine 3/RootHide compiled resources and
      # privileged entitlements, using a distinct bundle ID. Its entry points
      # explicitly refuse stock jailbreak/removal until RootHide is validated.
      - name: Verify full experimental RootHide 3 IPA
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST != 'YES'
        run: |
          set -euo pipefail
          cp Application/Dopamine.ipa Application/RootHide3-Full-Experimental.ipa
          python3 tools/verify_roothide_full_experimental.py --ipa Application/RootHide3-Full-Experimental.ipa --json | tee roothide-full-experimental-inspection.json
          printf 'ROOT HIDE 3 — FULL DOPAMINE COMPONENTS, NOT FUNCTIONAL JAILBREAK\nCommit: %s\nBundle: com.gokuencinar.roothide3.fulltest\nRootHide bootstrap gate: 0 / stock fallback blocked\nContains original Dopamine/RootHide exploit components and private entitlements.\nNo tests on a device: use only on disposable test hardware with compatible installation/signing.\n' "$GITHUB_SHA" > ROOT_HIDE_FULL_EXPERIMENTAL_README.txt

      - name: Upload guarded full experimental app
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST != 'YES'
        uses: actions/upload-artifact@v4
        with:
          name: RootHide3-FULL-EXPERIMENTAL-JAILBREAK-DISABLED
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ github.workspace }}/Application/RootHide3-Full-Experimental.ipa
            ${{ github.workspace }}/roothide-full-experimental-inspection.json
            ${{ github.workspace }}/ROOT_HIDE_FULL_EXPERIMENTAL_README.txt

      - name: Verify jailbreak-enabled RootHide hardware beta
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST == 'YES'
        run: |
          set -euo pipefail
          cp Application/Dopamine.ipa Application/RootHide3-Hardware-Beta.ipa
          python3 tools/verify_roothide_full_experimental.py --hardware-beta --ipa Application/RootHide3-Hardware-Beta.ipa --json | tee roothide-hardware-beta-inspection.json
          shasum -a 256 Application/RootHide3-Hardware-Beta.ipa > RootHide3-Hardware-Beta.ipa.sha256
          printf 'ROOT HIDE 3 — UNVALIDATED HARDWARE BETA, JAILBREAK ENABLED\nCommit: %s\nBundle: com.gokuencinar.roothide3.hardwarebeta\nRequires arm64e, iOS 15/16 and a compatible Dopamine exploit combination.\nDo not test over another bootstrap. Initial activation forces tweaks off.\nInstallation, launchd/dyld stability, hiding and recovery have NOT been verified on a device.\nSee HARDWARE-BETA.md for testing and recovery.\n' "$GITHUB_SHA" > ROOT_HIDE_HARDWARE_BETA_README.txt

      - name: Upload jailbreak-enabled RootHide hardware beta
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST == 'YES'
        uses: actions/upload-artifact@v4
        with:
          name: RootHide3-HARDWARE-BETA-JAILBREAK-ENABLED
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ github.workspace }}/Application/RootHide3-Hardware-Beta.ipa
            ${{ github.workspace }}/roothide-hardware-beta-inspection.json
            ${{ github.workspace }}/RootHide3-Hardware-Beta.ipa.sha256
            ${{ github.workspace }}/ROOT_HIDE_HARDWARE_BETA_README.txt
            ${{ github.workspace }}/HARDWARE-BETA.md

      # Compile first so early RootHide port errors are visible in CI, but
      # never upload an unverified stock artifact as a RootHide release.
      - name: Check RootHide port prerequisites before upload
        if: steps.roothide_port.outputs.is_port == 'true'
        run: python3 tools/roothide_port_audit.py --strict

      - name: Upload Artifact
        # Never label the stock IPA as a verified RootHide build.
        if: steps.roothide_port.outputs.is_port == 'false'
        id: dopamine-latest-upload
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine
          path: |
            ${{ github.workspace }}/Application/Dopamine.ipa
