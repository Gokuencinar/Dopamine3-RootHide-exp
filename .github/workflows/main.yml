name: "Dopamine: build and upload"
run-name: "RootHide3 r${{ github.run_number }}.a${{ github.run_attempt }} - ${{ github.event_name == 'workflow_dispatch' && inputs.hardware_beta == true && 'Hardware Beta' || 'CI' }}"

on:
  push:
    branches:
      # '*' matches only branch names without '/'. Integration branches such
      # as fix/roothide3-ssh-preboot-installer-rc never received native CI.
      - '**'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:
    inputs:
      hardware_beta:
        description: 'Build the unvalidated RootHide jailbreak-enabled hardware beta'
        type: boolean
        required: true
        default: false
      ui_preview:
        description: 'Capture isolated UIKit previews and update credits in the pinned native beta'
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.ui_preview == true
    uses: ./.github/workflows/ui-preview.yml
    permissions:
      contents: read
      actions: read
  # A completely standalone UIKit-only application. Build it independently so
  # unfinished jailbreak libraries and RootHide port failures cannot prevent
  # generation of the harmless install/open smoke-test IPA.
  device-test:
    if: startsWith(github.head_ref || github.ref_name, 'roothide-') && !(github.event_name == 'workflow_dispatch' && inputs.ui_preview == true)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install signing utility
        uses: dhinakg/procursus-action@4526d5e64410da26bea8073926c0bf8e779293f1
        with:
          packages: ldid

      - name: Test standalone diagnostic safeguards
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_roothide_device_test.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_roothide_device_test_verifier.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_roothide_build_matrix.py' -v

      - name: Build standalone RootHide device-test app
        run: |
          set -euo pipefail
          make -C Application diagnostic

      - name: Inspect standalone RootHide device-test IPA
        run: |
          set -euo pipefail
          python3 tools/verify_roothide_device_test.py --ipa Application/RootHide3-Device-Test.ipa --json | tee roothide-device-test-inspection.json
          printf 'RootHide 3: app de diagnóstico.\nSirve para probar instalación y apertura; no incluye jailbreak ni bootstrap.\nNecesita refirmarse con un instalador compatible.\n' > ROOT_HIDE_DEVICE_TEST_README.txt

      - name: Upload standalone device-test IPA
        uses: actions/upload-artifact@v4
        with:
          name: RootHide3-Device-Test-APP-ONLY-r${{ github.run_number }}-a${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/Application/RootHide3-Device-Test.ipa
            ${{ github.workspace }}/roothide-device-test-inspection.json
            ${{ github.workspace }}/ROOT_HIDE_DEVICE_TEST_README.txt

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.ui_preview != true
    runs-on: macos-15
    permissions:
      contents: write # Manual hardware-beta releases only; PR tokens remain read-only.
    env:
      # Only an explicit manual dispatch can enable the hardware variant.
      ROOTHIDE_HARDWARE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.hardware_beta == true && 'YES' || 'NO' }}
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # peeled commit for v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
            submodules: recursive

      # github.ref_name is "<number>/merge" in pull_request runs. Detect the
      # actual checked-out port as well as its branch, so a RootHide PR can
      # never silently publish an ordinary artifact named "Dopamine".
      - name: Classify experimental RootHide sources
        id: roothide_port
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" == roothide-* ]] ||
             [[ -f BaseBin/libjailbreak/src/roothider.h ]]; then
            echo 'is_port=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_port=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Procursus
        uses: dhinakg/procursus-action@4526d5e64410da26bea8073926c0bf8e779293f1
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      # Object-only compilation cache. Keep this separate from the immutable
      # SDK/bootstrap download caches: an entry is a compiler result, never a
      # signed executable, BaseBin trustcache, packaged tweak or IPA.
      # Read/write only on trusted owner-initiated builds (never on untrusted PR code).
      - name: Identify incremental compiler cache
        if: steps.roothide_port.outputs.is_port == 'true'
        id: ccache_identity
        shell: bash
        run: |
          set -euo pipefail
          xcode_id="$(xcodebuild -version | shasum -a 256 | cut -c 1-16)"
          echo "xcode_id=$xcode_id" >> "$GITHUB_OUTPUT"

      - name: Restore RootHide object cache
        if: steps.roothide_port.outputs.is_port == 'true' && github.event_name == 'workflow_dispatch'
        id: rh3_object_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache-roothide3
          # Each run writes an immutable entry; later runs restore the latest
          # compatible one via the Xcode- and build-mode-scoped prefix.
          key: rh3-objects-macos15-xcode-${{ steps.ccache_identity.outputs.xcode_id }}-${{ env.ROOTHIDE_HARDWARE_TEST }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          # Object-level ccache checks all inputs; reuse unchanged objects
          # from ordinary CI even when the app's activation define changes.
          restore-keys: |
            rh3-objects-macos15-xcode-${{ steps.ccache_identity.outputs.xcode_id }}-${{ env.ROOTHIDE_HARDWARE_TEST }}-v1-
            rh3-objects-macos15-xcode-${{ steps.ccache_identity.outputs.xcode_id }}-NO-v1-

      - name: Configure incremental C and Objective-C cache
        if: steps.roothide_port.outputs.is_port == 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install ccache
          prefix="$(brew --prefix ccache)"
          test -x "$prefix/libexec/clang"
          test -x "$prefix/libexec/clang++"
          ccache --version | head -n 1
          # For Theos, Clang Makefiles and projects using PATH. CMake-based
          # subprojects can use the supported compiler-launcher environment.
          echo "PATH=$prefix/libexec:$PATH" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=$prefix/bin/ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$prefix/bin/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache-roothide3" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=512M" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          # Never ignore headers, compiler revisions, preprocessor settings
          # or system headers to get higher hit rates.
          export CCACHE_DIR="$HOME/.cache/ccache-roothide3"
          ccache --zero-stats

      # Cache only an immutable, SHA-256-pinned download. Do not cache signed
      # binaries, the BaseBin trustcache, or installable IPAs.
      - name: Restore pinned Theos SDK download
        id: theos_sdk_cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/theos/iPhoneOS16.5.sdk.tar.xz
          key: rh3-macos15-theos-sdk-16.5-5e0fd3f01266cce4-v1

      - name: Install THEOS
        env:
          RH3_PORT: ${{ steps.roothide_port.outputs.is_port }}
        run: |
          set -euo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          # Use an explicitly pinned Theos revision, not an installer that
          # updates a mutable HEAD. Preserve its recursive vendor submodules.
          # The RootHide tweak targets use a different Theos package scheme.
          # Keep official Theos for the upstream Dopamine branches.
          THEOS_REPO=theos/theos
          THEOS_REV=304e0799973e8145f32e4ca2de6c747a84b758ce
          if [[ "$RH3_PORT" == true ]]; then
            THEOS_REPO=roothide/theos
            THEOS_REV=cfba89a53a05b4a1b822121158acc3669c20602f
          fi
          git clone --recursive "https://github.com/${THEOS_REPO}.git" "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_REV"
          git -C "$THEOS" submodule update --init --recursive
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_REV"
          mkdir -p "$THEOS/sdks"
          SDK_ARCHIVE="$BASEDIR/.ci-cache/theos/iPhoneOS16.5.sdk.tar.xz"
          SDK_SHA256=5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb
          mkdir -p "$(dirname "$SDK_ARCHIVE")"
          if [[ -f "$SDK_ARCHIVE" && ! -L "$SDK_ARCHIVE" ]] &&
             echo "$SDK_SHA256  $SDK_ARCHIVE" | shasum -a 256 -c - >/dev/null 2>&1; then
            echo "Using verified cached Theos SDK archive"
          else
            rm -f "$SDK_ARCHIVE"
            curl -fL --retry 3 \
              https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
              --output "$SDK_ARCHIVE.download"
            echo "$SDK_SHA256  $SDK_ARCHIVE.download" | shasum -a 256 -c -
            mv -f "$SDK_ARCHIVE.download" "$SDK_ARCHIVE"
          fi
          echo "$SDK_SHA256  $SDK_ARCHIVE" | shasum -a 256 -c -
          # Decode the verified XZ archive (not gzip).
          tar -xJf "$SDK_ARCHIVE" -C "$THEOS/sdks"
          test -n "$(find "$THEOS/sdks" -type d -name '*.sdk' -print -quit)"
          cd $BASEDIR

      # Later strict readiness deliberately fails when only 7/9 gates pass.
      # Save before that gate instead of relying on actions/cache post-job save.
      - name: Save verified Theos SDK download
        if: steps.theos_sdk_cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/roothide-dopamine3-integration'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/theos/iPhoneOS16.5.sdk.tar.xz
          key: rh3-macos15-theos-sdk-16.5-5e0fd3f01266cce4-v1

      - name: Build and Install trustcache
        run: |
          set -euo pipefail
          brew install openssl@3
          git clone https://github.com/CRKatri/trustcache
          git -C trustcache checkout --detach aa0e8847529cf76576fce8d2dbc9e088c8f1a0df
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl@3)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl@3)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Install libarchive
        run: |
          brew install libarchive zstd

      - name: Restore verified Procursus bootstrap downloads
        id: bootstrap_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Application/Dopamine/Resources/bootstrap_1800.tar.zst
            Application/Dopamine/Resources/bootstrap_1900.tar.zst
          key: rh3-macos15-bootstrap-1800-a99b39bb-1900-8354c3aa-v1

      - name: Download Bootstraps
        run: |
            set -euo pipefail
            cd Application/Dopamine/Resources
            bash ./download_bootstraps.sh

      - name: Save verified Procursus bootstrap downloads
        if: steps.bootstrap_cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/roothide-dopamine3-integration'
        uses: actions/cache/save@v4
        with:
          path: |
            Application/Dopamine/Resources/bootstrap_1800.tar.zst
            Application/Dopamine/Resources/bootstrap_1900.tar.zst
          key: rh3-macos15-bootstrap-1800-a99b39bb-1900-8354c3aa-v1

      - name: Verify RootHide Boomerang and trustcache regressions
        if: steps.roothide_port.outputs.is_port == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_roothide_boomerang_trustcache.py' -v

      - name: Verify full experimental app safeguards
        if: steps.roothide_port.outputs.is_port == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_roothide_full_experimental.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_roothide_build_matrix.py' -v

      - name: Test complete RootHide port regressions
        if: steps.roothide_port.outputs.is_port == 'true'
        run: |
          set -euo pipefail
          python3 tools/verify_roothide_cpu_slices.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Build
        # The readiness script must use the same RootHide classification as
        # Theos selection, including PR refs such as 123/merge.
        env:
          ROOTHIDE_EXPERIMENTAL_BUILD: ${{ steps.roothide_port.outputs.is_port == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          bash tools/macos_build_readiness.sh
          if [[ "${{ steps.roothide_port.outputs.is_port }}" == true ]]; then
            gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1 RH3_CCACHE=1
          else
            gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1
          fi

      - name: Report incremental compilation cache statistics
        if: always() && steps.roothide_port.outputs.is_port == 'true'
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
            {
              echo '### RootHide incremental compile cache'
              echo '\`\`\`text'
              ccache --show-stats
              echo '\`\`\`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # This must happen BEFORE the deliberately failing strict-readiness
      # gate. Upload no binaries; save only ccache's compiler objects.
      - name: Save RootHide object cache
        if: success() && steps.roothide_port.outputs.is_port == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache-roothide3
          key: rh3-objects-macos15-xcode-${{ steps.ccache_identity.outputs.xcode_id }}-${{ env.ROOTHIDE_HARDWARE_TEST }}-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check RootHide binary architecture slices
        if: steps.roothide_port.outputs.is_port == 'true'
        run: |
          set -euo pipefail
          for binary in libjailbreak.dylib launchdhook.dylib systemhook.dylib roothidehooks.dylib rootlesshooks.dylib; do
            file="BaseBin/.build/$binary"
            test -f "$file"
            architectures="$(xcrun lipo -archs "$file")"
            echo "$binary: $architectures"
            [[ " $architectures " == *" arm64 "* ]] || { echo "$binary lacks arm64" >&2; exit 1; }
            [[ " $architectures " == *" arm64e "* ]] || { echo "$binary lacks arm64e" >&2; exit 1; }
          done

      # A completed Xcode/ldid build is NOT proof of RootHide functionality.
      # Save it in a plainly quarantined diagnostic artifact so developers can
      # inspect linker output without distributing it as a jailbreak release.
      - name: Inspect quarantined RootHide build
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST != 'YES'
        run: |
          set -euo pipefail
          python3 tools/verify_roothide_build.py --ipa Application/Dopamine.ipa --json | tee roothide-build-inspection.json
          printf 'RootHide 3: paquete para revisar la compilación.\nRevisión: %s\nJailbreak desactivado. Sin pruebas en un iPhone.\n' "$GITHUB_SHA" > ROOT_HIDE_DO_NOT_INSTALL.txt

      - name: Upload quarantined RootHide compile artifact
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST != 'YES'
        uses: actions/upload-artifact@v4
        with:
          name: RootHide3-COMPILE-ONLY-NOT-FOR-INSTALL-r${{ github.run_number }}-a${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ github.workspace }}/Application/Dopamine.ipa
            ${{ github.workspace }}/BaseBin/basebin.tar
            ${{ github.workspace }}/roothide-build-inspection.json
            ${{ github.workspace }}/ROOT_HIDE_DO_NOT_INSTALL.txt

      # A second artifact with ALL Dopamine 3/RootHide compiled resources and
      # privileged entitlements, using a distinct bundle ID. Its entry points
      # explicitly refuse stock jailbreak/removal until RootHide is validated.
      - name: Verify full experimental RootHide 3 IPA
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST != 'YES'
        run: |
          set -euo pipefail
          cp Application/Dopamine.ipa Application/RootHide3-Full-Experimental.ipa
          python3 tools/verify_roothide_full_experimental.py --ipa Application/RootHide3-Full-Experimental.ipa --json | tee roothide-full-experimental-inspection.json
          printf 'RootHide 3: app completa con el jailbreak desactivado.\nRevisión: %s\nNecesita refirmarse. Para intentar el jailbreak, usa la Hardware Beta.\nConsulta FULL-EXPERIMENTAL.md.\n' "$GITHUB_SHA" > ROOT_HIDE_FULL_EXPERIMENTAL_README.txt

      - name: Upload guarded full experimental app
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST != 'YES'
        uses: actions/upload-artifact@v4
        with:
          name: RootHide3-FULL-EXPERIMENTAL-JAILBREAK-DISABLED-r${{ github.run_number }}-a${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ github.workspace }}/Application/RootHide3-Full-Experimental.ipa
            ${{ github.workspace }}/roothide-full-experimental-inspection.json
            ${{ github.workspace }}/ROOT_HIDE_FULL_EXPERIMENTAL_README.txt

      - name: Verify jailbreak-enabled RootHide hardware beta
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST == 'YES'
        id: hardware_beta_package
        run: |
          set -euo pipefail
          cp Application/Dopamine.ipa Application/RootHide3-Hardware-Beta.ipa
          python3 tools/verify_roothide_full_experimental.py --hardware-beta --ipa Application/RootHide3-Hardware-Beta.ipa --json | tee roothide-hardware-beta-inspection.json
          # Validate the signed main Mach-O CodeDirectory and embedded policy,
          # not merely the signing load-command offsets. This remains an ad-hoc
          # signature: Apple provisioning and actual sideloading are not tested.
          python3 tools/verify_roothide_app_signature.py --ipa Application/RootHide3-Hardware-Beta.ipa --json | tee roothide-app-signature-inspection.json
          suffix="r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          asset="RootHide3-Hardware-Beta-${suffix}.ipa"
          tag="roothide3-hw-${suffix}"
          cp Application/RootHide3-Hardware-Beta.ipa "Application/$asset"
          (cd Application && shasum -a 256 "$asset" > "$asset.sha256")
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf 'RootHide 3: beta con el intento de jailbreak habilitado.\nRevisión: %s\nPerfiles experimentales para arm64/arm64e e iOS 15, 16, 17, 18 y 26. Los exploits de Dopamine deciden la combinación admitida.\nEmpieza sin tweaks. No se ha probado en un iPhone.\nHaz una copia de tus datos y consulta HARDWARE-BETA.md.\n' "$GITHUB_SHA" > ROOT_HIDE_HARDWARE_BETA_README.txt

      - name: Upload jailbreak-enabled RootHide hardware beta
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST == 'YES'
        uses: actions/upload-artifact@v4
        with:
          name: RootHide3-HARDWARE-BETA-JAILBREAK-ENABLED-r${{ github.run_number }}-a${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ github.workspace }}/Application/${{ steps.hardware_beta_package.outputs.asset }}
            ${{ github.workspace }}/roothide-hardware-beta-inspection.json
            ${{ github.workspace }}/roothide-app-signature-inspection.json
            ${{ github.workspace }}/Application/${{ steps.hardware_beta_package.outputs.asset }}.sha256
            ${{ github.workspace }}/ROOT_HIDE_HARDWARE_BETA_README.txt
            ${{ github.workspace }}/HARDWARE-BETA.md

      # r188 demonstrated that signing and structural checks may succeed while
      # the jailbreak still fails on a device. Keep manual test artifacts in
      # Actions, but NEVER publish a public Release before the functional
      # validation gate. Do not set the gate or invent device evidence.
      - name: Check RootHide prerequisites before public release
        if: steps.roothide_port.outputs.is_port == 'true'
        run: python3 tools/roothide_port_audit.py --strict

      # upload-artifact wraps its contents in a ZIP. Publish the verified
      # IPA itself only after the strict gate, for a true direct .ipa URL.
      # This is also gated to explicit manual hardware beta builds.
      - name: Publish directly downloadable experimental IPA
        if: steps.roothide_port.outputs.is_port == 'true' && env.ROOTHIDE_HARDWARE_TEST == 'YES' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/roothide-dopamine3-integration' || github.ref == 'refs/heads/fix/roothide3-ssh-preboot-installer-rc')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET: ${{ steps.hardware_beta_package.outputs.asset }}
          TAG: ${{ steps.hardware_beta_package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASSET" && test -n "$TAG"
          test -f "Application/$ASSET"
          test -f "Application/$ASSET.sha256"
          (cd Application && shasum -a 256 -c "$ASSET.sha256")
          gh release create "$TAG" "Application/$ASSET" "Application/$ASSET.sha256" \
            --target "$GITHUB_SHA" \
            --title "RootHide 3 Hardware Beta ${TAG#roothide3-hw-}" \
            --notes-file ROOT_HIDE_HARDWARE_BETA_README.txt \
            --prerelease --latest=false
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          {
            echo '### Experimental RootHide 3 Hardware Beta (not hardware validated)'
            echo "[Download IPA directly]($url)"
            echo "SHA-256: \`$(shasum -a 256 "Application/$ASSET" | cut -d ' ' -f 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact
        # Never label the stock IPA as a verified RootHide build.
        if: steps.roothide_port.outputs.is_port == 'false'
        id: dopamine-latest-upload
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine
          path: |
            ${{ github.workspace }}/Application/Dopamine.ipa
